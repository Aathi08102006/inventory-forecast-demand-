<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demandly AI</title>
<style>
:root{--ink:#172033;--muted:#65708a;--line:#e7eaf2;--blue:#4f63f6;--purple:#7957d9;--bg:#f5f7fc;--green:#159c5a;--amber:#dd8400;--red:#d7354d}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}aside{position:fixed;width:238px;inset:0 auto 0 0;background:#171d35;color:#dbe0f3;padding:25px 14px;display:flex;flex-direction:column}.brand{font-size:20px;font-weight:800;color:#fff}.tag{font-size:11px;color:#8f9aba;line-height:1.5;margin:5px 3px 27px}.nav button{width:100%;border:0;background:transparent;color:#adb7d3;padding:11px 12px;border-radius:9px;text-align:left;cursor:pointer;font:inherit}.nav button:hover,.nav .active{background:#27335e;color:#fff}.notice{margin-top:auto;color:#93a0c2;font-size:11px;line-height:1.5}main{margin-left:238px;padding:30px;max-width:1550px}.heading{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:22px}h1{font-size:25px;margin:0 0 5px}h2{font-size:16px;margin:0 0 14px}p.sub{margin:0;color:var(--muted)}.grid{display:grid;gap:16px}.four{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:0 2px 8px #17203308}.metric b{display:block;font-size:28px;margin:5px 0}.metric span,label,.small{color:var(--muted);font-size:12px}.hero{background:linear-gradient(135deg,#eef0ff,#faf7ff);text-align:center}.forecast{font-size:48px;font-weight:850;color:var(--blue);line-height:1}.range{margin:22px 8px 10px;height:35px;position:relative;background:linear-gradient(90deg,#eef0ff,#bfc8ff,#eef0ff);border-radius:20px}.range:before{content:'';position:absolute;left:0;right:0;top:17px;border-top:2px dashed #8795f9}.dot{position:absolute;top:9px;width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid white;box-shadow:0 0 0 2px var(--blue)}.range-labels{display:flex;justify-content:space-between;font-size:12px}.badge{border-radius:30px;padding:4px 9px;font-size:11px;font-weight:700;display:inline-block}.low{background:#daf5e7;color:#06703a}.medium{background:#fff0c9;color:#9a6000}.high,.veryhigh{background:#ffe1e4;color:#a51f38}.risk-low{color:var(--green)}.risk-medium{color:var(--amber)}.risk-high{color:var(--red)}.driver{display:grid;grid-template-columns:130px 1fr 46px;gap:9px;align-items:center;margin:10px 0}.bar{height:7px;background:#edf0f6;border-radius:8px}.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--purple),var(--blue))}.up{color:var(--green)}.down{color:var(--red)}button.primary,button.secondary{border:0;border-radius:8px;padding:10px 14px;font:600 13px inherit;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#edf0f8;color:#34405b}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:flex;justify-content:space-between;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;accent-color:var(--blue)}select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;font:inherit}textarea{height:75px}.scenario{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;cursor:pointer}.scenario:hover,.scenario.on{border-color:var(--blue);background:#f5f6ff}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-weight:600}.callout{border-left:4px solid var(--blue);padding:11px 13px;background:#f3f5ff;border-radius:0 8px 8px 0;line-height:1.5}.warning{border-color:var(--amber);background:#fff8e9}.danger{border-color:var(--red);background:#fff0f2}.hide{display:none}.option{border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}.option.selected{border-color:var(--blue);background:#f3f5ff}.timeline{height:150px;width:100%;background:repeating-linear-gradient(0deg,#fff,#fff 29px,#eef0f5 30px);position:relative;overflow:hidden}.timeline svg{width:100%;height:100%}@media(max-width:900px){aside{position:static;width:auto;min-height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.notice{display:none}main{margin:0;padding:18px}.four,.three,.two,.controls{grid-template-columns:1fr}.heading{display:block}.card{padding:15px}}
</style></head><body><aside><div class="brand">📦 Demandly AI</div><div class="tag">Uncertainty-Aware Demand Forecasting<br>Don't just forecast. Plan for what's possible.</div><div class="nav" id="nav"></div><div class="notice">⚠ Synthetic data only<br>Forecasts are estimates, not guarantees.</div></aside><main id="app"><div class="card">Loading Demandly AI…</div></main>
<script>
const S={page:'dashboard',store:'S011',product:'P001',params:{temperature:32,rainfall:0,festival_intensity:.5,discount:0,warehouse_capacity:100,delivery_delay:0,weekend:1,month:11},forecast:null,stores:[],products:[],plan:'balanced',logs:[]};
const PAGES=[['dashboard','🏠 Dashboard'],['forecast','📈 Forecasts'],['scenario','🎯 Scenario Lab'],['disruption','⚠ Disruptions'],['decision','📋 Planner Decisions'],['evaluation','📊 Evaluation'],['drivers','🌦 Demand Drivers'],['responsible','🧠 Responsible AI']];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,body){let r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);if(!r.ok)throw Error('Request failed');return r.json()}
function badge(v,kind=''){let c=kind||v.toLowerCase().replace(' ','');return '<span class="badge '+c+'">'+esc(v)+'</span>'}
function nav(){document.querySelector('#nav').innerHTML=PAGES.map(([id,label])=>'<button class="'+(S.page===id?'active':'')+'" onclick="go(\''+id+'\')">'+label+'</button>').join('')}
function range(f){let pos=((f.p50-f.p10)/(f.p90-f.p10))*100;return '<div class="range"><i class="dot" style="left:calc('+pos+'% - 9px)"></i></div><div class="range-labels"><span>P10<br><b>'+f.p10+'</b></span><span>Expected<br><b>'+f.p50+'</b></span><span>P90<br><b>'+f.p90+'</b></span></div><p class="small">80% prediction interval: comparable actual demand fell in this range about 80% of the time in the evaluation set.</p>'}
function drivers(f){if(!f.drivers.length)return '<p class="small">No material drivers detected.</p>';let m=Math.max(...f.drivers.map(x=>x.pct));return f.drivers.map(d=>'<div class="driver"><span>'+esc(d.name)+'</span><div class="bar"><i style="width:'+Math.max(8,d.pct/m*100)+'%"></i></div><b class="'+d.direction+'">'+(d.direction==='down'?'-':'+')+d.pct+'%</b></div>').join('')}
function selector(){return '<div class="card"><div class="controls"><div class="field"><label>Store</label><select onchange="setStore(this.value)">'+S.stores.map(x=>'<option value="'+x.store_id+'" '+(x.store_id===S.store?'selected':'')+'>'+esc(x.store_name)+' · '+esc(x.city)+'</option>').join('')+'</select></div><div class="field"><label>Product</label><select onchange="setProduct(this.value)">'+S.products.map(x=>'<option value="'+x.product_id+'" '+(x.product_id===S.product?'selected':'')+'>'+esc(x.product_name)+' · '+esc(x.category)+'</option>').join('')+'</select></div><div class="field"><label>Planning condition</label><select onchange="setParam(\'weekend\',this.value)"><option value="0" '+(!S.params.weekend?'selected':'')+'>Normal weekday</option><option value="1" '+(S.params.weekend?'selected':'')+'>Weekend</option></select></div></div></div>'}
function forecastCard(f){return '<div class="card hero"><div class="small">TOMORROW’S EXPECTED DEMAND</div><div class="forecast">'+f.p50.toLocaleString()+'</div><div class="small">units · '+badge(f.uncertainty)+'</div>'+range(f)+'<div class="callout '+(f.risk_level==='HIGH'?'danger':'')+'"><b class="risk-'+f.risk_level.toLowerCase()+'">'+f.risk_level+' planning risk</b><br>'+ (f.risk_factors.length?esc(f.risk_factors.join(' • ')):'No active disruption detected.')+'</div></div>'}
function dashboard(){let f=S.forecast;return title('Today’s Planning Overview','A forecast is a range, drivers, and a decision — never just one number.')+'<div class="grid four">'+metric('128','Forecasts today')+metric('17','High-uncertainty items')+metric('24','Festival-affected stores')+metric('3','Disruption alerts')+'</div>'+selector()+'<div class="grid two">'+forecastCard(f)+'<div class="card"><h2>Why this forecast?</h2>'+drivers(f)+'<div class="callout"><b>Planner guidance:</b> '+guidance(f)+'</div><button class="primary" onclick="go(\'scenario\')">Explore scenarios</button></div></div><div class="card"><h2>Forecast timeline</h2><div class="timeline"><svg viewBox="0 0 600 150" preserveAspectRatio="none"><path d="M0,105 C45,85 75,120 120,93 S195,65 240,90 S330,75 365,63 S450,40 510,58 S565,34 600,46" fill="none" stroke="#303a52" stroke-width="3"/><path d="M365,56 C450,25 510,32 600,35 L600,90 C510,96 450,99 365,104Z" fill="#dce1ff"/><path d="M365,80 C450,65 510,68 600,61" fill="none" stroke="#4f63f6" stroke-width="3" stroke-dasharray="8 5"/></svg></div><p class="small">Solid = actual historical demand · dashed = forecast · shaded = 80% prediction interval</p></div>'}
function metric(v,l){return '<div class="card metric"><span>'+l+'</span><b>'+v+'</b><span>synthetic demo overview</span></div>'}function title(h,s){return '<div class="heading"><div><h1>'+h+'</h1><p class="sub">'+s+'</p></div><span class="badge medium">Synthetic prototype</span></div>'}function guidance(f){return f.risk_level==='HIGH'?'Pre-position stock and review alternate fulfillment before committing.':'A balanced position manages demand variation without stocking to the highest case.'}
function forecastPage(){let f=S.forecast;return title('Forecast workspace','Change planning inputs. Each adjustment calls the Demandly forecast API.')+selector()+'<div class="grid two"><div class="card"><h2>Forecast conditions</h2>'+controls()+'<button class="primary" onclick="refresh()">Update forecast</button></div><div>'+forecastCard(f)+'</div></div><div class="card"><h2>Forecast drivers</h2>'+drivers(f)+'</div>'}
function controls(){let a=[['temperature','Temperature',18,48,'°C',1],['rainfall','Rainfall',0,80,'mm',1],['festival_intensity','Festival intensity',0,1,'',.05],['discount','Price discount',0,30,'%',1],['warehouse_capacity','Warehouse capacity',40,100,'%',1],['delivery_delay','Delivery delay',0,48,'h',1]];return a.map(x=>'<div class="field"><label>'+x[1]+' <b id="v-'+x[0]+'">'+S.params[x[0]]+x[4]+'</b></label><input type="range" min="'+x[2]+'" max="'+x[3]+'" step="'+x[5]+'" value="'+S.params[x[0]]+'" oninput="setParam(\''+x[0]+'\',this.value,false)"></div>').join('')}
const DEMOS={normal:{temperature:32,festival_intensity:0,rainfall:0,discount:0,warehouse_capacity:100,delivery_delay:0,weekend:0,month:11},festival:{temperature:34,festival_intensity:.9,rainfall:0,discount:10,warehouse_capacity:100,delivery_delay:0,weekend:1,month:11},heat:{temperature:42,festival_intensity:0,rainfall:0,discount:0,warehouse_capacity:100,delivery_delay:0,weekend:0,month:5},delay:{temperature:32,festival_intensity:0,rainfall:0,discount:0,warehouse_capacity:100,delivery_delay:12,weekend:0,month:11},capacity:{temperature:32,festival_intensity:.4,rainfall:0,discount:0,warehouse_capacity:70,delivery_delay:0,weekend:0,month:11}};
function scenario(){let rows=Object.entries(DEMOS).map(([name,p])=>'<tr><td>'+esc(name[0].toUpperCase()+name.slice(1))+'</td><td>'+Math.round(180*(p.temperature/32))+'+ model</td><td>'+ (p.delivery_delay?'Expedite supply':p.warehouse_capacity<100?'Prioritize demand':'Review inventory')+'</td><td><button class="secondary" onclick="demo(\''+name+'\')">Apply</button></td></tr>').join('');return title('Scenario Lab','Test a normal day and disruption alternatives using the same forecast service.')+selector()+'<div class="grid two"><div class="card"><h2>Base scenario inputs</h2>'+controls()+'<button class="primary" onclick="refresh()">Run scenario</button></div>'+forecastCard(S.forecast)+'</div><div class="card"><h2>Ready-to-use demo cases</h2><table><thead><tr><th>Case</th><th>Forecast mode</th><th>Planning focus</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'}
function disruption(){let normal=DEMOS.normal, current=S.params;return title('Disruption Mode','Compare normal operations with an active disruption. Demand and fulfillment risk are separated.')+selector()+'<div class="grid three">'+[['delay','🚛 Delivery delay','Supplier delivery delayed by 12 hours'],['capacity','🏭 Capacity loss','Warehouse availability reduced to 70%'],['heat','🌡 Heatwave','Temperature reaches 42°C'],['festival','🎉 Festival surge','High local festival intensity']].map(x=>'<div class="scenario '+(S.params.delivery_delay===12&&x[0]==='delay'?'on':'')+'" onclick="demo(\''+x[0]+'\')"><b>'+x[1]+'</b><p class="small">'+x[2]+'</p></div>').join('')+'</div><div class="grid two"><div class="card"><h2>Normal operating day</h2><p><b>Expected demand:</b> conditions at 32°C, normal delivery, full capacity.</p><div class="callout">Normal replenishment. Use the balanced planning position.</div></div>'+forecastCard(S.forecast)+'</div><div class="card danger callout"><b>Disruption interpretation</b><br>Delivery delay and capacity loss do not automatically mean customers buy less; they increase fulfillment risk. Use the high end of the demand range when service continuity matters.</div>'}
function decision(){let f=S.forecast;let opts=[['conservative','Conservative',f.recommendations.conservative,'Higher service level; higher inventory cost'],['balanced','Balanced',f.recommendations.balanced,'Moderate stockout risk and inventory cost'],['aggressive','Aggressive',f.recommendations.aggressive,'Lower inventory cost; higher stockout risk']];return title('Planner Decisions','The AI recommends; the planner decides and can record an override.')+selector()+'<div class="grid two"><div class="card"><h2>Recommended planning position</h2><div class="callout"><b>Balanced · '+f.recommendations.balanced+' units</b><br>'+guidance(f)+'</div>'+opts.map(o=>'<div class="option '+(S.plan===o[0]?'selected':'')+'" onclick="choose(\''+o[0]+'\')"><b>'+o[1]+'</b> · '+o[2]+' units<br><span class="small">'+o[3]+'</span></div>').join('')+'<label class="small">Override reason (optional)</label><textarea id="reason" placeholder="e.g., Store manager expects stronger festival traffic"></textarea><button class="primary" onclick="saveDecision()">Record planner decision</button></div>'+forecastCard(f)+'</div><div class="card"><h2>Decision log</h2><div id="logs">'+logsHtml()+'</div></div>'}
function logsHtml(){return S.logs.length?'<table><tr><th>Date</th><th>Store</th><th>Product</th><th>Decision</th><th>Reason</th></tr>'+S.logs.map(x=>'<tr><td>'+esc(x.recorded_on)+'</td><td>'+esc(x.store_name)+'</td><td>'+esc(x.product_name)+'</td><td>'+esc(x.planner_action)+'</td><td>'+esc(x.reason||'—')+'</td></tr>').join('')+'</table>':'<p class="small">No recorded decisions in this project folder yet.</p>'}
async function evaluation(){let e=await api('/api/evaluation'),er=await api('/api/errors');return title('Forecast Reliability','Measured on the held-out synthetic evaluation data — not claimed as real-world performance.')+'<div class="grid two"><div class="card"><h2>Baseline vs Demandly</h2><table><tr><th>Metric</th><th>Seasonal naive baseline</th><th>Demandly</th></tr>'+[['MAE',e.baseline.mae,e.demandly.mae],['RMSE',e.baseline.rmse,e.demandly.rmse],['MAPE',e.baseline.mape+'%',e.demandly.mape+'%']].map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td><b>'+r[2]+'</b></td></tr>').join('')+'</table></div><div class="card"><h2>Calibration</h2><p>80% interval target: <b>80%</b></p><p>Actual coverage: <b>'+Math.round(e.coverage.pct80*1000)/10+'%</b></p><p>Calibration error: <b>'+Math.abs(80-e.coverage.pct80*100).toFixed(1)+' percentage points</b></p><div class="callout">Coverage is measured from data. A well-calibrated interval is not a guarantee for an individual day.</div></div></div><div class="card"><h2>Error analysis</h2><table><tr><th>Category</th><th>Count</th><th>Share</th><th>Impact</th></tr>'+er.error_categories.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.count+'</td><td>'+x.pct+'%</td><td>'+esc(x.impact)+'</td></tr>').join('')+'</table></div>'}
function driversPage(){return title('Demand Drivers','Driver effects are product-sensitive and are always shown with the forecast.')+'<div class="grid two"><div class="card"><h2>Weather</h2><p>Temperature, rainfall and heatwave conditions affect cold drinks, water and ice cream most strongly.</p></div><div class="card"><h2>Festival & calendar</h2><p>Festival intensity, weekends and seasonal patterns influence demand and widen uncertainty when conditions are unusual.</p></div><div class="card"><h2>Price & promotion</h2><p>Discounts are shown explicitly so planners can verify that promotional effects are not hidden.</p></div><div class="card"><h2>Store attributes</h2><p>Store size and type distinguish demand scale across locations.</p></div></div>'}
function responsible(){return title('Responsible Forecasting','Designed to support planning judgment, not automate it away.')+'<div class="grid two">'+[['No false certainty','Every forecast displays P10–P90 ranges.'],['Transparency','Demand drivers and disruption factors are visible.'],['Human control','A planner can accept or override recommendations and record why.'],['Synthetic data limitation','All supplied data and results are synthetic demonstration material.'],['Prototype validation','No formal industry planner study has been conducted.'],['Known failure cases','Missing festival data, extreme weather, delayed delivery, capacity loss and spikes require elevated caution.']].map(x=>'<div class="card"><h2>'+x[0]+'</h2><p>'+x[1]+'</p></div>').join('')+'</div>'}
function render(){nav();let views={dashboard,forecast:forecastPage,scenario,disruption,decision,evaluation,drivers:driversPage,responsible};let out=views[S.page]();if(out instanceof Promise)out.then(x=>document.querySelector('#app').innerHTML=x).catch(()=>document.querySelector('#app').innerHTML='<div class="card danger">Unable to load evaluation data. Start the Demandly server and refresh.</div>');else document.querySelector('#app').innerHTML=out}
function go(x){S.page=x;render()}function setStore(x){S.store=x;refresh()}function setProduct(x){S.product=x;refresh()}function setParam(k,v,run=true){S.params[k]=Number(v);let el=document.querySelector('#v-'+k);if(el)el.textContent=v+(k==='temperature'?'°C':k==='rainfall'?'mm':k==='discount'||k==='warehouse_capacity'?'%':k==='delivery_delay'?'h':'');if(run)refresh()}async function refresh(){S.forecast=await api('/api/forecast',{store_id:S.store,product_id:S.product,params:S.params});render()}function demo(name){S.params={...DEMOS[name]};refresh()}function choose(x){S.plan=x;render()}async function saveDecision(){let action=S.plan[0].toUpperCase()+S.plan.slice(1);let reason=document.querySelector('#reason')?.value||'';await api('/api/planner-decision',{store_name:S.forecast.store_name,product_name:S.forecast.product_name,forecast:S.forecast.p50,range:S.forecast.p10+'–'+S.forecast.p90,planner_action:action,override:S.plan!=='balanced',reason});S.logs=await api('/api/planner-decisions');render();alert('Planner decision recorded.')}
async function boot(){[S.stores,S.products,S.logs]=await Promise.all([api('/api/stores'),api('/api/products'),api('/api/planner-decisions')]);await refresh()}boot().catch(e=>document.querySelector('#app').innerHTML='<div class="card danger"><h2>Cannot connect to Demandly AI</h2><p>Start the server with <code>python backend/main.py</code> from the project folder, then open http://localhost:8000.</p></div>');
</script></body></html>
