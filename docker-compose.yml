version: "3.9"

services:
  demandly:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PORT=8000
    command: >
      bash -c "
        pip install pandas numpy scikit-learn joblib --quiet &&
        python3 dataset/generate_data.py &&
        python3 backend/forecasting/train_model.py &&
        python3 evaluation/evaluate.py &&
        python3 backend/main.py
      "
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stores')"]
      interval: 30s
      timeout: 10s
      retries: 3
